<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Verification Complete</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#0d1117;
      overflow:hidden;
      color:white;
    }

    .bg{
      position:absolute;
      width:100%;
      height:100%;
      background:
      radial-gradient(circle at top left,#6d28d9 0%,transparent 35%),
      radial-gradient(circle at bottom right,#2563eb 0%,transparent 35%),
      #0d1117;
      filter: blur(20px);
      z-index:0;
    }

    .card{
      position:relative;
      z-index:1;
      background:rgba(255,255,255,0.05);
      border:1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(15px);
      padding:50px;
      border-radius:25px;
      text-align:center;
      width:90%;
      max-width:500px;
      box-shadow:0 0 30px rgba(0,0,0,0.4);
      animation: fadeIn 1s ease;
    }

    .check{
      font-size:80px;
      margin-bottom:20px;
      color:#22c55e;
      text-shadow:0 0 15px #22c55e;
    }

    h1{
      font-size:42px;
      margin-bottom:15px;
    }

    p{
      color:#cbd5e1;
      margin-bottom:35px;
      font-size:18px;
    }

    .btn{
      display:inline-block;
      padding:16px 35px;
      border-radius:14px;
      text-decoration:none;
      color:white;
      font-size:18px;
      font-weight:bold;
      background:linear-gradient(135deg,#5865F2,#7c3aed);
      transition:0.3s ease;
      box-shadow:0 0 20px rgba(88,101,242,0.5);
    }

    .btn:hover{
      transform:scale(1.05);
      box-shadow:0 0 30px rgba(88,101,242,0.8);
    }

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translateY(20px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }
  </style>
</head>
<body>

  <div class="bg"></div>

  <div class="card">
    <div class="check">✔</div>

    <h1>You are verified now!</h1>

    <p>Your verification was completed successfully.</p>

    <a 
      class="btn" 
      href="https://discord.gg/DA3NVVhPy5" 
      target="_blank"
    >
      Go back to server
    </a>
  </div>

</body>
</html>
